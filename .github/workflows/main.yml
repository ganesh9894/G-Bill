name: Build BillMate AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create . --platforms=android --project-name billmate_ai

      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      - name: Install BillMate AI source
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get packages
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: billmate-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
